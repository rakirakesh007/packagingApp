<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Inventory</h1>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div
      *ngFor="let item of items()"
      class="bg-white shadow-md rounded-lg p-4 border"
      [ngClass]="{ 'border-red-500': item.total_stock <= (item.low_stock_threshold ?? 0) }"
    >
      <h2 class="text-lg font-bold">{{ item.item_name }}</h2>
      <p>Total Stock: {{ item.total_stock }}</p>
      <p>Unit Price: {{ item.unit_price | currency }}</p>
      <p *ngIf="item.purchase_price">Purchase Price: {{ item.purchase_price | currency }}</p>
      <p *ngIf="item.total_stock <= (item.low_stock_threshold ?? 0)" class="text-red-500">
        Low Stock
      </p>
      <button
        *ngIf="isAdmin()"
        class="bg-blue-500 text-white px-4 py-2 rounded mt-4"
        (click)="manageStock(item)"
      >
        Manage Stock
      </button>
    </div>
  </div>
</div>

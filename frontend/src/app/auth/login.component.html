<div class="login-page">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">

    <div class="login-brand">
      <span class="login-logo">🌶️</span>
      <h1 class="login-title">DesiMasalaHub</h1>
      <p class="login-sub">Sign in to continue</p>
    </div>

    @if (errorMessage()) {
      <div class="error-alert" role="alert">{{ errorMessage() }}</div>
    }

    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" formControlName="username" type="text"
        autocomplete="username" placeholder="Enter username" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password"
        autocomplete="current-password" placeholder="Enter password" />
    </div>

    <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading()">
      @if (isLoading()) { Signing in... } @else { Sign In }
    </button>
  </form>
</div>

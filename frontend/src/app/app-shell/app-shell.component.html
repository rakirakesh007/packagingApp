<div class="app-shell" [class.is-admin]="userRole() === 'admin'" [class.is-delivery]="userRole() === 'delivery_boy'">

  <!-- Global cold-start loading bar -->
  @if (loading.isLoading()) {
    <div class="loading-bar" role="progressbar" aria-label="Loading"></div>
  }

  <!-- Admin Sidebar -->
  @if (userRole() === 'admin') {
    <aside class="side-nav" aria-label="Admin navigation">
      <div class="brand-area">
        <span class="brand-icon">🌶️</span>
        <div class="brand-text">
          <p class="brand-name">DesiMasalaHub</p>
          <p class="brand-sub">Admin Panel</p>
        </div>
      </div>
      <nav class="nav-links">
        <a routerLink="/app/admin"      routerLinkActive="active"><span class="nav-icon">📊</span> Dashboard</a>
        <a routerLink="/app/marketing" routerLinkActive="active"><span class="nav-icon">📣</span> Marketing</a>
        <a routerLink="/app/bulk-entry" routerLinkActive="active"><span class="nav-icon">📝</span> Bulk Entry</a>
        <a routerLink="/app/inventory"  routerLinkActive="active"><span class="nav-icon">📦</span> Inventory</a>
        <a routerLink="/app/assignment" routerLinkActive="active"><span class="nav-icon">🚚</span> Assignment</a>
        <a routerLink="/app/users"      routerLinkActive="active"><span class="nav-icon">👥</span> Delivery Boys</a>
        <a routerLink="/app/expenses"   routerLinkActive="active"><span class="nav-icon">💰</span> Expenses</a>
        <a routerLink="/app/reports"    routerLinkActive="active"><span class="nav-icon">📋</span> Reports</a>
      </nav>
      <button class="sidebar-logout" (click)="logout()">🚪 Logout</button>
    </aside>
  }

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Delivery Boy Bottom Tabs -->
  @if (userRole() === 'delivery_boy') {
    <nav class="bottom-tab-bar" aria-label="Delivery navigation">
      <a routerLink="/app/sales" routerLinkActive="active">
        <span class="tab-icon">🛒</span>
        <span class="tab-label">Sales</span>
      </a>
      <a routerLink="/app/daily-report" routerLinkActive="active">
        <span class="tab-icon">📊</span>
        <span class="tab-label">Report</span>
      </a>
      <button class="tab-logout" (click)="logout()">
        <span class="tab-icon">🚪</span>
        <span class="tab-label">Logout</span>
      </button>
    </nav>
  }

</div>

<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Create Assignment</h1>

  <label for="deliveryBoy" class="block text-sm font-medium text-gray-700">
    Select Delivery Boy
  </label>
  <select
    id="deliveryBoy"
    [(ngModel)]="deliveryBoyId"
    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
  >
    <option value="">Select</option>
    <option *ngFor="let boy of deliveryBoys()" [value]="boy.id">
      {{ boy.name }}
    </option>
  </select>

  <h2 class="text-xl font-bold mt-6">Inventory Items</h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div
      *ngFor="let item of inventoryItems()"
      class="bg-white shadow-md rounded-lg p-4 border"
    >
      <h3 class="text-lg font-bold">{{ item.item_name }}</h3>
      <p>Total Stock: {{ item.total_stock }}</p>
      <p>Unit Price: {{ item.unit_price | currency }}</p>
      <label for="qty" class="block text-sm font-medium text-gray-700">
        Quantity to Load
      </label>
      <input
        type="number"
        id="qty"
        [(ngModel)]="item.qty"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
      />
    </div>
  </div>

  <button
    class="bg-blue-500 text-white px-4 py-2 rounded mt-4"
    (click)="confirmAssignment()"
  >
    Confirm Loading
  </button>
</div>

<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Morning Assignment</h1>

  <label for="deliveryBoy" class="block text-sm font-medium text-gray-700">Select Delivery Boy</label>
  <select
    id="deliveryBoy"
    [ngModel]="selectedDeliveryBoyId()"
    (ngModelChange)="selectedDeliveryBoyId.set($event)"
    class="mt-1 mb-4 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm"
    aria-label="Select delivery boy"
  >
    <option value="">-- Select --</option>
    @for (boy of deliveryBoys(); track boy._id) {
      <option [value]="boy._id">{{ boy.name }}</option>
    }
  </select>

  <h2 class="text-xl font-bold mt-4 mb-2">Inventory Items</h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    @for (item of inventoryItems(); track item.id) {
      <div class="bg-white shadow rounded-lg p-4 border">
        <h3 class="text-lg font-bold">{{ item.item_name }}</h3>
        <p class="text-sm text-gray-500">Stock: {{ item.total_stock }}</p>
        <label class="block text-sm font-medium text-gray-700 mt-2">Qty to Load</label>
        <input
          type="number"
          [ngModel]="item.assignedQty"
          (ngModelChange)="item.assignedQty = $event"
          class="mt-1 block w-full rounded border-gray-300 shadow-sm sm:text-sm"
          min="0"
          [max]="item.total_stock"
          [attr.aria-label]="'Quantity for ' + item.item_name"
        />
      </div>
    }
  </div>

  <button
    class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded mt-6 disabled:opacity-50"
    (click)="confirmAssignment()"
    [disabled]="!selectedDeliveryBoyId()"
  >
    Confirm Loading
  </button>
</div>
